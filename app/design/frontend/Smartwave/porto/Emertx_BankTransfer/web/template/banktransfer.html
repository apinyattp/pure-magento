<div class="payment-method" data-bind="css: {'_active': (getCode() == isChecked())}">
    <div class="payment-method-title field choice">
        <div class="radio" style="display: flex">
            <input type="radio"
                   name="payment[method]"
                   class="radio dgm-radio"
                   data-bind="attr: {'id': getCode()}, value: getCode(), checked: isChecked, click: selectPaymentMethod, visible: isRadioButtonVisible()" />
            <label data-bind="attr: {'for': getCode()}"
                   class="label text-size-18"
                   style="padding-left: 40px; padding-top: 2px;"
            >
<!--                <span data-bind="i18n: getTitle()"></span>-->
                <span data-bind="i18n: 'Bank Transfer Payment'"></span>
            </label>
        </div>
    </div>

    <div class="payment-method-content">
        <!-- ko foreach: getRegion('messages') -->
        <!-- ko template: getTemplate() --><!-- /ko -->
        <!--/ko-->
        
        <div class="payment-bank-accounts" data-bind="visible: hasBankAccounts()">
            <table class="tbl-bank-accounts">
                <thead>
                    <tr>
                        <th data-bind="i18n: 'Bank'" class="bank">Bank</th>
                        <th data-bind="i18n: 'Account No.'" class="bank-accno">Account No.</th>
                        <th data-bind="i18n: 'Account Name'" class="bank-accname">Account Name</th>
                    </tr>
                </thead>
                <tbody data-bind="foreach: { data: getBankAccounts(), as: 'item' }">
                    <tr>
                        <td class="bank-name">
                            <label>
                                <img data-bind="attr:{src: item.logo}" class="bank-logo">
                                <span data-bind="text: item.bank"
                                      class="text-size-18 text-xs-size-16 text-color-1"
                                      style="font-weight: normal; padding-left: 5px"
                                ></span>
                            </label>
                        </td>
                        <td data-bind="text: item.accno" class="bank-accno"></td>
                        <td data-bind="text: item.accname" class="bank-accname"></td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="payment-method-billing-address">
            <!-- ko foreach: $parent.getRegion(getBillingAddressFormName()) -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>
        <p data-bind="html: getInstructions()"></p>
        <div class="checkout-agreements-block">
            <!-- ko foreach: $parent.getRegion('before-place-order') -->
                <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>
        <div class="actions-toolbar">
            <div class="primary">
                <button class="action primary checkout"
                        type="submit"
                        data-bind="
                        click: placeOrder,
                        attr: {'title': $t('Place Order')},
                        enable: (getCode() == isChecked()),
                        css: {disabled: !isPlaceOrderActionAllowed()}
                        "
                        disabled>
                    <span data-bind="i18n: 'Place Order'"></span>
                </button>
            </div>
        </div>
    </div>
</div>
